name: release

# Builds the player bundle with tools/release/build-release.sh (see docs/dev/setup.md, "Release build") and the
# Windows setup with tools/release/build-installer.ps1 (docs/architecture/windows-installer.md).
#   - push of a tag v<version> (e.g. v1.1.0): publishes a GitHub Release with FarmPulse-<version>-Setup.exe,
#     FarmPulse-<version>.zip and FS25_RPSim.zip; the tag must match the project version, the release notes come from
#     CHANGELOG.md
#   - push to main: publishes the rolling pre-release "snapshot" (tag snapshot, moved to the pushed commit) with
#     FarmPulse-<version>-snapshot-Setup.exe, FarmPulse-<version>-snapshot.zip and FS25_RPSim.zip; the notes are the
#     [Unreleased] section of CHANGELOG.md
#   - manual run (workflow_dispatch) and pull requests touching the release tooling or the desktop mode: build only,
#     the files are attached to the run as workflow artifacts
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/release/**
      - backend/src/main/java/de/farmpulse/rpsim/desktop/**
      - backend/src/main/resources/application-desktop.yml
  workflow_dispatch:

permissions:
  contents: write   # gh release create

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # Angular CLI 22 needs Node >= 22.22.3
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/bridge-simulator/package-lock.json
      # the backend E2E test drives the real bridge simulator (skipped without Node)
      - name: Bridge simulator dependencies
        working-directory: tools/bridge-simulator
        run: npm ci
      - name: Version
        id: version
        run: |
          VERSION="$(node -p "require('./frontend/package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the project version $VERSION (expected v$VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # also checks that pom.xml, package.json, modDesc.xml and CHANGELOG.md agree on the version
      - name: Build release (incl. backend tests)
        run: tools/release/build-release.sh
      - name: Release notes from CHANGELOG.md
        if: github.event_name != 'push' || github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release/RELEASE_NOTES.md
          test -s release/RELEASE_NOTES.md
      - name: Snapshot notes from CHANGELOG.md
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "Snapshot build of \`main\` at ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC')), project version $VERSION."
            echo "Not a release: this pre-release is replaced on every push to \`main\`."
            echo
            echo "## Unreleased changes"
            awk '
              index($0, "## [Unreleased]") == 1 { f = 1; next }
              f && /^## \[/ { exit }
              f { print }
            ' CHANGELOG.md
          } > release/RELEASE_NOTES.md
      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: FarmPulse-${{ steps.version.outputs.version }}
          path: |
            release/FarmPulse-${{ steps.version.outputs.version }}.zip
            release/FS25_RPSim.zip
            release/RELEASE_NOTES.md
          if-no-files-found: error
      # input of the Windows setup (jar + built frontend), not published
      - name: Upload setup input
        uses: actions/upload-artifact@v6
        with:
          name: setup-input
          path: |
            release/rpsim-backend-${{ steps.version.outputs.version }}.jar
            release/farmpulse-web-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 1

  windows-installer:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # jpackage bundles this runtime with the setup
      - uses: actions/download-artifact@v4
        with:
          name: setup-input
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: FarmPulse-${{ needs.build.outputs.version }}
          path: release
      - name: Build setup (jpackage + Inno Setup)
        shell: pwsh
        run: |
          $name = "FarmPulse-$env:VERSION-Setup"
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'branch') { $name = "FarmPulse-$env:VERSION-snapshot-Setup" }
          tools/release/build-installer.ps1 -Version $env:VERSION -SetupName $name
      - name: Upload setup
        uses: actions/upload-artifact@v6
        with:
          name: FarmPulse-${{ needs.build.outputs.version }}-Setup
          path: release/*-Setup.exe
          if-no-files-found: error

  publish:
    needs: [build, windows-installer]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FarmPulse-${{ needs.build.outputs.version }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: FarmPulse-${{ needs.build.outputs.version }}-Setup
          path: release
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "FarmPulse $VERSION" \
            --notes-file release/RELEASE_NOTES.md \
            "release/FarmPulse-$VERSION-Setup.exe" \
            "release/FarmPulse-$VERSION.zip" \
            release/FS25_RPSim.zip
      # rolling pre-release: the previous snapshot and its tag are replaced by one on the pushed commit
      - name: Publish snapshot pre-release
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "release/FarmPulse-$VERSION.zip" "release/FarmPulse-$VERSION-snapshot.zip"
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "FarmPulse $VERSION Snapshot (${GITHUB_SHA::7})" \
            --notes-file release/RELEASE_NOTES.md \
            "release/FarmPulse-$VERSION-snapshot-Setup.exe" \
            "release/FarmPulse-$VERSION-snapshot.zip" \
            release/FS25_RPSim.zip
