name: backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'tools/bridge-simulator/**', 'docs/dev/configuration-reference.md', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'tools/bridge-simulator/**', 'docs/dev/configuration-reference.md', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # the backend E2E test drives the real bridge simulator (skipped without Node)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/bridge-simulator/package-lock.json
      - name: Bridge simulator dependencies
        working-directory: tools/bridge-simulator
        run: npm ci
      - name: Build and test (mvn verify, JaCoCo)
        working-directory: backend
        run: mvn -B verify
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
