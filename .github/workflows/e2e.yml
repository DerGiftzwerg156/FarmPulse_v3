name: e2e

# Playwright core flows against the real backend (profile e2e, FAKE AI) and the bridge simulator.
# Runs on every push to main and on pull requests: the suite takes ~30 s plus ~2 min of builds (see docs/dev/testing.md).
on:
  push:
    branches: [main]
  pull_request:
    paths: ['backend/**', 'frontend/**', 'tools/bridge-simulator/**', '.github/workflows/e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/bridge-simulator/package-lock.json
      - name: Build backend jar
        working-directory: backend
        run: mvn -B -q -DskipTests package
      - name: Install simulator dependencies
        working-directory: tools/bridge-simulator
        run: npm ci
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright E2E
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
