name: codeql

# Technical review 10/2026, Phase 0.6 (S-4): CodeQL code scanning (free for public repositories). Java is compiled with
# Maven (build-mode manual - the backend uses Lombok), JavaScript/TypeScript (frontend, tools) needs no build.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'   # weekly, catches new queries for unchanged code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        name: Compile backend
        working-directory: backend
        run: mvn -B -DskipTests compile
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
