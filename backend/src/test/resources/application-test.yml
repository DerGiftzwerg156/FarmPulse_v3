spring:
  datasource:
    url: jdbc:h2:mem:rpsim-test;DB_CLOSE_DELAY=-1
rpsim:
  web:
    lan:
      pbkdf2-iterations: 1000   # fast PIN hashing in tests
  bridge:
    enabled: false
    path: ./target/test-bridge
  ai:
    provider: NONE
    worker-enabled: false
    local-config-file: ./target/test-local-config/ai-provider.properties
