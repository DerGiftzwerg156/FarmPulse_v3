# Task descriptions per narration event type (building block 4). Keys = NarrationEventType.
ONBOARDING_WELCOME=Schreibe eine kurze Willkommensnachricht an die neue Betriebsleitung des Hofs und erkläre nebenbei, dass man dich per Mail oder Anruf erreicht.
STORY_HOOK=Greife die Prämisse aus den Fakten auf und erzähle sie als persönliche Nachricht, die neugierig macht.
BANK_CASHFLOW_WARNING=Melde dich als Bankberater:in, weil das Betriebsergebnis seit mehreren Monaten negativ ist, bevor eine Kreditrate platzt. Nenne Monat und Ergebnis aus den Fakten und biete ein Gespräch an.
COOPERATIVE_RECORD_HARVEST=Gratuliere als Genossenschaft zum höchsten Ernteerlös eines Monats seit Beginn; nenne Monat und Erlös aus den Fakten.
EMPLOYEE_STRIKE=Kündige als Mitarbeiter:in an, dass du die Arbeit niederlegst, bis sich beim schwächsten Punkt aus den Fakten etwas ändert. Dein Helfer im Spiel bleibt stehen.
EMPLOYEE_STRIKE_ENDED=Teile als Mitarbeiter:in mit, dass du wieder arbeitest, weil sich die Lage gebessert hat.
MECHANIC_REPORT=Berichte als angestellte:r Mechaniker:in kurz und bodenständig, wie viele Maschinen du diesen Monat wieder hinbekommen hast und wie viele noch warten müssen.
ANIMAL_KEEPER_WARNING=Warne als Tierpfleger:in, dass in den Ställen Futter oder Wasser knapp wird; nenne die Werte aus den Fakten und bitte um Nachschub.
VET_EMERGENCY=Berichte als Tierärzt:in von einem Notfalleinsatz, weil die Tiere eines Stalls krank sind; nenne Gesundheitswert und Rechnung aus den Fakten und rate zu besserer Versorgung.
CREDIT_APPROVED=Teile mit, dass der Kreditantrag genehmigt wurde, und nenne Betrag, Zinssatz und monatliche Rate aus den Fakten. Ist standingCropValue vorhanden, erwähne, dass die Bank den stehenden Bestand (mainStandingCrop) als Vermögen berücksichtigt hat. Ist collateralValue vorhanden, erwähne die Grundschuld auf den Feldern (collateralFields) und den Zinsnachlass (interestDiscountPercent).
CREDIT_COUNTER_OFFER=Teile mit, dass die Bank statt des beantragten Betrags ein Gegenangebot macht (Werte aus den Fakten), begründe grob anhand der Begründungskategorie und erkläre, dass das Angebot im Bank-Formular angenommen werden kann. Ist standingCropValue vorhanden, erwähne, dass die Bank den stehenden Bestand (mainStandingCrop) als Vermögen berücksichtigt hat. Ist collateralRequired=true, ist es ein Angebot „mit Grundschuld“: nenne die Felder (collateralFields), die belastet würden, und den Beleihungswert; sonst erwähne eine vorhandene Grundschuld und den Zinsnachlass (interestDiscountPercent).
CREDIT_REJECTED=Lehne den Kreditantrag höflich ab und begründe grob anhand der Begründungskategorie, ohne Formeln oder Punktwerte zu nennen. Ist standingCropValue vorhanden, erwähne, dass die Bank den stehenden Bestand (mainStandingCrop) als Vermögen berücksichtigt hat.
CREDIT_PAYMENT_REMINDER=Erinnere freundlich, aber bestimmt an die überfällige Kreditrate.
CREDIT_PENALTY=Teile mit, dass wegen des anhaltenden Zahlungsverzugs eine Verzugsgebühr berechnet wurde.
CREDIT_TRUST_WARNING=Mache deutlich, dass der anhaltende Zahlungsverzug das Vertrauen der Bank beschädigt.
CREDIT_CALLBACK=Teile mit, dass die Bank wegen wiederholten Zahlungsausfalls die gesamte Restschuld sofort fällig stellt.
CREDIT_BLOCKED=Teile mit, dass die Bank wegen wiederholten Zahlungsausfalls künftig keine Kredite mehr gewährt.
CREDIT_DEFERRAL_GRANTED=Bestätige die gewährte Stundung und nenne die Dauer aus den Fakten.
CREDIT_DEFERRAL_DENIED=Lehne die Bitte um Stundung ab und begründe grob anhand der Kategorie.
CREDIT_SPECIAL_REPAYMENT=Bestätige als Bankberater:in den Eingang der Sondertilgung (repaidAmount) und nenne die neue Restschuld und die verbleibenden Raten aus den Fakten; die Rate bleibt gleich, die Laufzeit verkürzt sich. Ist paidOff=true, ist der Kredit damit abgelöst: erwähne die anteiligen Zinsen (interestAmount), gratuliere aber nicht, das folgt in einer eigenen Nachricht. Ist feeAmount größer als 0, erkläre die Vorfälligkeitsentschädigung damit, dass die gebührenfreie Sondertilgung für dieses Jahr überschritten ist.
CREDIT_PAID_OFF=Gratuliere zur vollständigen Tilgung des Kredits.
MARKET_PRICE_EVENT=Berichte von der Marktentwicklung (Fruchtart, Verkaufsstelle, Veränderung in Prozent, Dauer) mit einer plausiblen, frei erfundenen Begründung.
MARKET_SPECIAL_OFFER=Biete einen Sonderkontrakt zum Festpreis für die angegebene Menge bis zur Frist an; der Spieler entscheidet im Markt-Formular über die Teilnahme.
MARKET_SUBSIDY=Kündige die Förderung (Betrag aus den Fakten) an.
MARKET_RUMOR=Erzähle ein Gerücht über eine mögliche Preisentwicklung. Ist isAccurate=true, beschreibe die echte Entwicklung bewusst etwas verzerrt; ist isAccurate=false, ist das Gerücht erfunden. Verrate nie, ob es stimmt.
MARKET_CONTRACT_ENDED=Fasse das Ende des Sonderkontrakts mit der gelieferten Menge zusammen.
AUCTION_ANNOUNCED=Kündige die Versteigerung des Feldes an (Größe, Schätzwert, Frist, Anzahl Mitbieter) und erwähne, dass Gebote nur über das Gebotsformular abgegeben werden.
NEGOTIATION_ACCEPTED=Bestätige die Einigung über das Feld zum Endpreis aus den Fakten.
NEGOTIATION_COUNTER=Reagiere auf das Gebot: nenne das Gegenangebot bzw. das aktuelle Höchstgebot aus den Fakten und die verbleibenden Runden.
NEGOTIATION_REJECTED=Lehne das Gebot ab; ist final=true, beende die Verhandlung endgültig.
AUCTION_WON=Gratuliere zum Zuschlag bei der Versteigerung zum Endpreis.
AUCTION_LOST=Teile mit, dass jemand anderes den Zuschlag erhalten hat.
SALE_OFFER_RECEIVED=Mache als Kaufinteressent ein erstes Angebot für das angebotene Feld (Betrag aus den Fakten).
SALE_NO_INTEREST=Teile mit, dass sich zum genannten Wunschpreis derzeit kein Käufer findet.
JOB_APPLICATION=Schreibe eine Bewerbung auf die Stelle; Erfahrung, Gehaltsvorstellung und eine bereits absolvierte Schulung (training, "keine" = keine erwähnen) ergeben sich aus den Fakten.
INTERVIEW_ANSWER=Beantworte die Frage im Vorstellungsgespräch in deiner Rolle. Fähigkeiten, Gehaltsvorstellung und Schulungen (training, "keine" = keine) sind fix und werden nicht verhandelt.
APPLICATION_REJECTED=Reagiere kurz auf die Absage deiner Bewerbung.
EMPLOYEE_WELCOME=Bedanke dich für die Einstellung und freue dich auf die Arbeit.
EMPLOYEE_THANKS=Bedanke dich für die Gehaltserhöhung bzw. die freien Tage bzw. die bezahlte Schulung (reason TRAINING, Fakt training).
EMPLOYEE_WARNING=Mache deutlich, dass du unzufrieden bist (Hauptgrund aus den Fakten) und über eine Kündigung nachdenkst.
EMPLOYEE_RESIGNATION=Kündige deine Stelle und verabschiede dich.
EMPLOYEE_SALARY_OVERDUE=Beschwere dich über das ausgebliebene Gehalt.
VILLAGE_CONGRATULATION=Gratuliere zu der guten Entwicklung des Hofs.
VILLAGE_INVITATION=Lade zum Fest aus den Fakten (occasion) ins Dorf ein und bitte um Zu- oder Absage in der App „Kalender“ innerhalb von rsvpDays Tagen.
VILLAGE_GOSSIP=Erzähle harmlosen Dorfklatsch über die genannte Person, ohne Marktbezug.
CHARACTER_FAREWELL=Verabschiede dich, weil du wegziehst bzw. in den Ruhestand gehst.
CHARACTER_INTRODUCTION=Stelle dich als neue Person im Dorf bzw. als Nachfolge in deiner Rolle vor.
ABSENCE_NOTICE=Schreibe eine automatische Abwesenheitsnotiz für die genannte Person mit der Dauer aus den Fakten.
SUBSTITUTE_INTRODUCTION=Stelle dich als Vertretung für die abwesende Person vor.
REPLY=Antworte auf die Nachricht des Spielers in deiner Rolle.
CALL_CONVERSATION=Antworte im laufenden Telefongespräch kurz und gesprochen in deiner Rolle.
# TODO T-20 insurance
INSURANCE_OFFER=Biete als Versicherungsmakler eine Sturm- und Hagelversicherung an (Tarif, Monatsprämie, Erstattungsquote in Prozent, Selbstbehalt, Gültigkeit aus den Fakten); der Spieler nimmt das Angebot in der App „Versicherung“ an.
INSURANCE_CONFIRMED=Bestätige den Abschluss der Versicherung mit Tarif und Monatsprämie aus den Fakten.
INSURANCE_PREMIUM_OVERDUE=Weise darauf hin, dass die Versicherungsprämie nicht abgebucht werden konnte und der Versicherungsschutz ruht, bis sie bezahlt ist.
INSURANCE_CANCELLED=Teile mit, dass die Versicherung (insuranceName) beendet ist; begründe anhand des Grunds (PLAYER = auf Wunsch gekündigt, MISSED_PAYMENTS = wegen unbezahlter Prämien).
DAMAGE_NOTICE=Berichte von dem Unwetterschaden (Sturm an Gebäuden oder Hagel auf einem Feld) mit der Schadenshöhe aus den Fakten. Bei Hagel nenne das Feld (fieldName) und, falls vorhanden, die betroffene Kultur (fruitType). Ist insured=true, bitte als Versicherungsmakler darum, den Schaden innerhalb der Frist zu melden (in der App „Versicherung“). Ist coverSuspended=true, erkläre, dass der Schutz wegen offener Prämien ruht. Sonst erzähle als Nachbar, was passiert ist.
INSURANCE_CLAIM_SETTLED=Bestätige als Versicherungsmakler die Regulierung des gemeldeten Schadens: Schadenshöhe, Erstattungsquote, Selbstbehalt, Auszahlungsbetrag und Zeitpunkt aus den Fakten.
INSURANCE_CLAIM_REJECTED=Teile als Versicherungsmakler mit, dass für den Schaden nichts gezahlt wird, weil die Meldefrist verstrichen ist.
# TODO T-20 hunting
WILDLIFE_DAMAGE_REPORTED=Berichte als Jagdpächter vom Wildschaden (Wildschweine) auf dem Feld (fieldName, falls vorhanden mit der Kultur fruitType), nenne die Schadenshöhe und dein Ersatzangebot aus den Fakten und die Antwortfrist. Der Spieler kann in der App „Versicherung“ annehmen, mehr fordern oder eine gemeinsame Maßnahme (Drückjagd, Zaun) vorschlagen.
WILDLIFE_COUNTER=Reagiere als Jagdpächter auf die Forderung des Spielers: nenne dein neues Angebot aus den Fakten; ist final=true, mache klar, dass es dein letztes Wort ist.
WILDLIFE_SETTLED=Bestätige als Jagdpächter die Einigung über den Wildschadenersatz (Betrag aus den Fakten); ist measure=true, freue dich über die vereinbarte gemeinsame Maßnahme.
WILDLIFE_DISPUTE=Reagiere als Jagdpächter enttäuscht darauf, dass der Spieler dein Ersatzangebot abgelehnt hat.
# TODO T-20 livestock
VET_VISIT=Berichte als Tierarzt vom Routinebesuch: Tierart, Anzahl, Befund (healthNote: ALL_HEALTHY = alles gesund, HOOF_CARE = Klauen-/Hufpflege empfohlen, VACCINATION_DUE = Impfung steht an, FEED_CHECK = Futter prüfen) und den Rechnungsbetrag aus den Fakten.
LIVESTOCK_OFFER=Mache als Viehhändler ein Angebot: direction=SELL heißt, du hast einen Abnehmer, wenn der Spieler die Anzahl Tiere im Spiel verkauft; direction=BUY heißt, du vermittelst Tiere, die der Spieler im Spiel kauft. Nenne Tierart, Anzahl, Prämie pro Tier, Frist und dass er in der App „Stall“ zusagt. Du handelst nicht selbst im Spiel.
LIVESTOCK_PREMIUM_PAID=Bestätige als Viehhändler, dass der Handel geklappt hat, und nenne die Prämie aus den Fakten.
LIVESTOCK_OFFER_LAPSED=Teile als Viehhändler freundlich mit, dass aus dem vereinbarten Handel nichts geworden ist.
BREEDING_ADVICE=Berate als Zuchtverband zur Tierzucht: nenne Tierart und Bestand; herdTrend GROWING = Nachwuchs, gratuliere; SHRINKING = Bestand gesunken; STABLE = unverändert; FIRST_CONTACT = erste Beratung. Gib einen allgemeinen Tipp zu Futter, Platz und Gesundheit.
# TODO T-22 lease
LEASE_OFFER=Biete als Feldbesitzer die Pacht des genannten Feldes an (Feld, Hektar, Monatspacht, Laufzeit in Monaten, Gültigkeit aus den Fakten); der Spieler nimmt das Angebot in der App „Flurkarte“ an.
LEASE_REFUSED=Lehne als Feldbesitzer die Anfrage, das genannte Feld zu pachten, freundlich ab – ohne neue Bedingungen zu nennen.
LEASE_CONFIRMED=Bestätige als Feldbesitzer die vereinbarte Pacht (Feld, Laufzeit, Monatspacht zum Monatsbeginn).
LEASE_ENDING=Erinnere als Feldbesitzer daran, dass die Pacht bald endet (Tage bis zum Ende); nenne die Verlängerung zur neuen Monatspacht und – nur wenn in den Fakten ein Kaufpreis steht – das Kaufangebot. Ohne Antwort geht das Feld zum Ende zurück.
LEASE_RENEWED=Bestätige als Feldbesitzer die Verlängerung der Pacht (Feld, weitere Laufzeit, neue Monatspacht).
LEASE_PURCHASED=Bestätige als bisheriger Besitzer, dass der Spieler das gepachtete Feld zum genannten Preis gekauft hat und die Pacht damit endet.
LEASE_RENT_OVERDUE=Weise als Feldbesitzer auf die offene Monatspacht hin; bei weiteren offenen Zahlungen wird das Feld zurückgenommen.
LEASE_ENDED=Teile als Feldbesitzer mit, dass die Pacht beendet ist und das Feld zurückgeht; begründe anhand des Grunds (TERM_ENDED = Laufzeit vorbei, RENT_MISSED = wegen unbezahlter Pacht, EARLY_RETURN = auf Wunsch des Spielers vorzeitig beendet).
# TODO T-22 maintenance
MAINTENANCE_OFFER=Biete als Werkstatt einen Wartungsvertrag an (Monatsgebühr, Anzahl Fahrzeuge, Reparaturgrenze in Prozent Zustand, maximale Reparaturen pro Monat, Gültigkeit aus den Fakten); der Spieler nimmt ihn in der App „Werkstatt“ an.
MAINTENANCE_CONFIRMED=Bestätige als Werkstatt den abgeschlossenen Wartungsvertrag (Monatsgebühr, Beginn zum nächsten Monatsanfang).
MAINTENANCE_REPAIRED=Berichte als Werkstatt kurz über die monatliche Wartung (Anzahl reparierter Maschinen, vorheriger Durchschnittszustand); alles ist im Vertrag enthalten.
MAINTENANCE_FEE_OVERDUE=Weise als Werkstatt auf die offene Wartungsgebühr hin; solange sie offen ist, gibt es keine Reparaturen.
MAINTENANCE_CANCELLED=Teile als Werkstatt mit, dass der Wartungsvertrag beendet ist; begründe anhand des Grunds (TERMINATED_BY_PLAYER = vom Spieler gekündigt, FEE_MISSED = wegen unbezahlter Gebühren).
REPAIR_HINT=Gib als Werkstatt einen freundlichen Hinweis, dass eine Maschine stark abgenutzt ist (Zustand in Prozent aus den Fakten), und erwähne die Reparatur im Spiel oder einen Wartungsvertrag – ohne Preise zu nennen.
# TODO T-22 contractor
MISSION_REFERRAL=Vermittle als Lohnunternehmer einen Auftrag des Spiels (Titel, Feld, Auftraggeber, Lohn aus den Fakten); der Spieler nimmt ihn im Auftragsmenü des Spiels an.
MISSION_THANKS=Bedanke dich als Lohnunternehmer, dass der vermittelte Auftrag erledigt wurde; der Auftraggeber war zufrieden.
MISSION_FAILED=Bedaure als Lohnunternehmer, dass der vermittelte Auftrag nicht erledigt wurde; bleib freundlich, aber ehrlich.
GOODS_OFFER=Biete als Nachbar Ware aus deinem Vorrat an (Sorte, Menge in Litern, Gesamtpreis und Preis je 1.000 Liter, Frist aus den Fakten); die Ware kommt in das Silo des Spielers, er sagt in der App „Handel“ zu. playerAsked=true heißt, der Spieler hat dich danach gefragt. Nenne nur die Zahlen aus den Fakten.
GOODS_REQUEST=Frag als Nachbar, ob der Spieler dir Ware aus seinem Silo abgibt (Sorte, Menge, Gesamtpreis und Preis je 1.000 Liter, Frist aus den Fakten); er sagt in der App „Handel“ zu. Nenne nur die Zahlen aus den Fakten.
GOODS_TRADE_DONE=Bedanke dich als Nachbar kurz für den erledigten Handel (Sorte, Menge, Preis aus den Fakten).
GOODS_REQUEST_FAILED=Sag als Nachbar enttäuscht, aber ohne Vorwurf, dass im Silo des Spielers nicht mehr genug Ware lag, als der Handel ausgeführt werden sollte.
NEIGHBOR_MISSION_REQUEST=Bitte als Nachbar um Hilfe bei einer Arbeit auf deinem Feld (Arbeit, Feld, Fläche, Bonus, Frist aus den Fakten); nach der Zusage steht der Auftrag im Auftragsmenü des Spiels, die Vergütung zahlt das Spiel, der Bonus kommt von dir bei Erfolg.
NEIGHBOR_MISSION_THANKS=Bedanke dich als Nachbar für die erledigte Arbeit auf deinem Feld und nenne den Bonus aus den Fakten.
NEIGHBOR_MISSION_DISAPPOINTED=Sag als Nachbar enttäuscht, dass aus der Arbeit auf deinem Feld nichts geworden ist; bleib höflich.
FIELD_NEIGHBOR_COMPLAINT=Sprich als Nachbarlandwirt den Spieler auf sein Feld (fieldName) an: topic=WEEDS heißt viel Unkraut, topic=STONES viele Steine. Bei stage=NEIGHBOR_FRIENDLY freundlich und nachbarschaftlich, bei stage=NEIGHBOR_ANNOYED sichtlich genervt, weil du es schon einmal angesprochen hast. Keine Zahlen erfinden.
FIELD_GOSSIP=Erzähle als Dorfbewohner, was im Dorf über das Feld des Spielers (fieldName) geredet wird: topic=WITHERED heißt, die Kultur (fruitType) ist verdorrt; topic=FALLOW heißt, dort wächst seit langem nichts. topic=DROUGHT heißt, wegen der ausgerufenen Dürre leidet die Kultur (fruitType) wie alle Felder im Dorf unter der Trockenheit. Plaudernd, nicht belehrend.
FIELD_HARVEST_CONGRATULATION=Gratuliere als Genossenschaft, dass im Jahr harvestYear alle erntereifen Felder rechtzeitig geerntet wurden und nichts verdorrt ist; nenne die Zahl der Ernten (harvestedFields).
FIELD_WORK_HINT=Gib als Genossenschaft einen kurzen, sachlichen Hinweis zu Feld fieldName: hint=HARVEST_READY heißt, die Kultur (fruitType) ist erntereif; hint=LIME heißt, der Boden braucht Kalk; hint=PLOW heißt, das Feld sollte gepflügt werden. Nur diesen einen Hinweis, keine weiteren Ratschläge erfinden.
VANILLA_LOAN_TAKEN=Sprich als Bankberater/in den Spieler darauf an, dass er sich außerhalb der Bank Geld geliehen hat (loanAmount, offen vanillaLoanRemaining). Leicht gekränkt, aber professionell; biete Gespräche für das nächste Mal an. Ist repeated=true, erkläre, dass neue Kredite der Bank deshalb interestSurchargePercent Prozentpunkte mehr Zinsen kosten, bis der andere Kredit getilgt ist.
VANILLA_LOAN_REPAID=Nimm als Bankberater/in sachlich und leicht wohlwollend zur Kenntnis, dass der Spieler repaidAmount seines anderen Kredits zurückgezahlt hat (offen vanillaLoanRemaining). Ist fullyRepaid=true, sage, dass damit auch ein etwaiger Zinsaufschlag entfällt.
FIELD_BOUGHT_OVER_HEAD=Beschwere dich als früherer Besitzer verärgert, dass der Spieler dein Feld farmlandId über deinen Kopf hinweg im Spielmenü gekauft hat, ohne mit dir zu verhandeln. Ist compensationClaim vorhanden, verlange diesen Betrag als Ausgleich und nenne die Frist (decisionDays Tage); der Spieler kann in der App „Flurkarte“ zahlen oder ablehnen.
COMPENSATION_SETTLED=Bestätige als früherer Feldbesitzer, dass der Ausgleich (compensation) für Feld farmlandId angekommen ist und die Sache erledigt ist.
COMPENSATION_DISPUTE=Reagiere als früherer Feldbesitzer enttäuscht bis verärgert, dass der Spieler den Ausgleich (compensation) für Feld farmlandId verweigert hat (ignored=true: gar nicht geantwortet). Keine Drohungen, aber du merkst es dir.
OUTSIDE_HELPERS_HINT=Mache als Genossenschaft freundlich darauf aufmerksam, dass auf dem Hof ständig Helfer von außen arbeiten (outsideHelpers laufende Helfer ohne eigenen Mitarbeiter), und rege an, jemanden fest einzustellen (Stelle unter „Personal“ ausschreiben).
TAX_PREPAYMENT=Fordere als Finanzamt sachlich die Steuervorauszahlung für das Quartal quarter des Jahres taxYear an (amount, Frist paymentDays Tage, Zahlung in der App „Ämter“).
TAX_ASSESSMENT=Erläutere als Finanzamt den Steuerbescheid für das Jahr taxYear nachvollziehbar mit allen Zahlen aus den Fakten (Einnahmen, Ausgaben, Abschreibung, Zinsen, Gewinn, Freibetrag, zu versteuern, Steuersatz, Steuer, Vorauszahlungen, Restbetrag). balance > 0 ist eine Nachzahlung (Frist paymentDays Tage, Zahlung in der App „Ämter“), balance < 0 eine Erstattung. Ist advisorReduction vorhanden, nenne die Ersparnis durch die Steuerberatung.
TAX_REMINDER=Mahne als Finanzamt höflich, aber bestimmt die überfällige Zahlung billTitle (amount) an und nenne den bisherigen Säumniszuschlag (lateFees).
TAX_ENFORCEMENT=Drohe als Finanzamt förmlich Vollstreckungsmaßnahmen an, weil billTitle seit overdueMonths Monaten offen ist (amount, Säumniszuschlag lateFees). Keine konkreten Pfändungen behaupten.
TAX_AUDIT_ANNOUNCED=Kündige als Finanzamt eine Betriebsprüfung für das Jahr taxYear an; das Ergebnis folgt in etwa auditDays Tagen.
TAX_AUDIT_RESULT=Teile als Finanzamt das Ergebnis der Betriebsprüfung für das Jahr taxYear mit: backPayment > 0 ist eine Nachforderung (Zahlung in der App „Ämter“, Frist paymentDays Tage), 0 heißt ohne Beanstandung.
TAX_ADVISOR_OFFER=Biete als Steuerberater/in deine Dienste an: monthlyFee Euro im Monat, rund taxReductionPercent Prozent weniger Steuer, Erinnerung an Fristen, seltener Prüfungen; Angebot gilt validDays Tage, Annahme in der App „Ämter“.
TAX_ADVISOR_REMINDER=Erinnere als Steuerberater/in freundlich daran, dass billTitle (amount) in daysLeft Tagen fällig ist.
AUTHORITY_ROTATION_NOTICE=Weise als Landwirtschaftsamt darauf hin, dass auf Feld fieldName zwei Jahre in Folge dieselbe Kultur (fruitType) stand; bitte um Fruchtwechsel. Ist repeated=true, kündige an, dass die Fruchtfolgeprämie deshalb gekürzt wird.
AUTHORITY_SUBSIDY=Teile als Landwirtschaftsamt die Fruchtfolgeprämie für das Jahr harvestYear mit (hectares Hektar mit Fruchtwechsel, premium Euro); ist cut=true, erkläre die Kürzung wegen wiederholt gleicher Kultur.
AUTHORITY_INSPECTION_NOTICE=Kündige als Landwirtschaftsamt eine Kontrolle an: rule=CULTIVATION_DUTY heißt Bewirtschaftungspflicht (Feld ohne Kultur mit Unkraut oder Steinen), rule=ANIMAL_WELFARE heißt Tierwohl (Gesundheit, Futter, Wasser). Nenne subject und die Frist (inspectionDays Tage), in der der Spieler Abhilfe schaffen kann.
AUTHORITY_INSPECTION_RESULT=Teile als Landwirtschaftsamt das Ergebnis der Kontrolle (rule, subject) mit: result=IN_ORDER ohne Beanstandung, REQUIREMENT eine Auflage mit neuer Frist (inspectionDays Tage), FINED ein Bußgeld (fine Euro).
FAMILY_OCCASION=Schreibe als Familienmitglied (relation) eine kurze, warmherzige Nachricht zum Anlass occasion (BIRTHDAY Geburtstag, WEDDING_DAY Hochzeitstag, SCHOOL_START erster Schultag).
FAMILY_FIELD_SOLD=Reagiere als Familienmitglied (relation) enttäuscht, dass das Familienfeld farmlandId verkauft wurde, das schon beim Großvater in der Familie war. Keine Vorwürfe über Geldbeträge.
FAMILY_HARVEST_HELP=Biete als Familienmitglied (relation) an, zur Erntezeit mitzuhelfen. Nur Worte, keine Versprechen zu Spielwerten.
SPONSORING_REQUEST=Bitte als Vorsitz des Vereins (club) um Unterstützung für das Vereinsjahr; Beträge von smallestTier bis largestTier Euro, Auswahl oder Absage in der App „Kontakte“ innerhalb von decisionDays Tagen.
SPONSORING_THANKS=Bedanke dich als Vorsitz des Vereins (club) herzlich für die Unterstützung (amount Euro).
COLLATERAL_SALE_CONSENT=Stimme als Bankberater:in dem Verkauf des belasteten Felds zu, unter der Bedingung, dass der Erlös den Betrag repayment des Kredits tilgt (wird beim Verkauf automatisch gebucht, ohne Vorfälligkeitsentschädigung). Nenne nur die Zahlen aus den Fakten.
COLLATERAL_CLAIM=Melde dich als Bankberater:in verärgert, weil ein Feld mit Grundschuld ohne Absprache im Spielmenü verkauft wurde. Fordere die Sondertilgung (claim) innerhalb der Frist (claimDays Tage), zahlbar in der App „Bank“.
COLLATERAL_CLAIM_OVERDUE=Mahne als Bankberater:in ernst die unbezahlte Sondertilgung (claim) nach dem Feldverkauf an: Sie zählt wie eine verpasste Rate, und bis sie bezahlt ist, gibt es keine neuen Kredite. Sie bleibt in der App „Bank“ zahlbar.
CREDIT_COLLATERAL_REALISED=Teile als Bankberater:in sachlich mit, dass die Bank nach der Fälligstellung die Grundschuld verwertet hat: die Felder (fields) gehen zum Beleihungswert collateralValue an die Bank, der gegen die Restschuld remainingDebt gerechnet wird. Ist surplus größer als 0, wird der Überschuss gutgeschrieben.
LIQUIDITY_WARNING=Melde dich als Bankberater:in vorausschauend: Nach der Liquiditätsplanung fällt der Kontostand im Monat shortfallMonth (in monthsAhead Monaten) unter null (projectedBalance). Nenne die bekannten Abbuchungen (knownPostings), verweise auf die Planung in der App „Bank“ und biete ein Gespräch an. Die Einnahmen sind nur geschätzt.
ANNUAL_REVIEW_INVITATION=Lade als Bankberater:in zum Jahresgespräch ein und kommentiere kurz das abgelaufene Jahr mit den Zahlen aus den Fakten (Einnahmen, Ausgaben, Betriebsergebnis, Steuer, Ernte, Regen, Personal und Dorf-Ansehen im Vergleich zum Vorjahr, soweit vorhanden). Der Termin wird in der App „Bank“ bestätigt (Frist invitationDays Tage). Erfinde keine Zahlen.
ANNUAL_REVIEW_OFFER=Fasse als Bankberater:in das Jahresgespräch freundlich zusammen: Wegen des guten Ergebnisses bietet die Bank eine Zinssenkung um rateCutPercent Prozentpunkte auf die laufenden Kredite an; die Restlaufzeit bleibt, die Rate sinkt. Das Angebot gilt offerDays Tage in der App „Bank“.
ANNUAL_REVIEW_NEUTRAL=Fasse als Bankberater:in das Jahresgespräch ruhig zusammen; an den laufenden Konditionen ändert sich nichts. goodResult=true heißt, das Ergebnis war gut, es gibt aber keinen Kredit für eine Zinssenkung.
ANNUAL_REVIEW_SERIOUS=Fasse als Bankberater:in das Jahresgespräch in ernstem Ton zusammen: Die Finanzen sind angespannt. Die laufenden Verträge werden nicht verschärft, aber der Spieler soll sich frühzeitig melden, wenn es eng wird.
PRICE_ALARM=Melde dich als Landhändler:in kurz, weil der Preisalarm des Spielers angeschlagen hat: Sorte, Verkaufsstelle, aktueller Preis je 1.000 Liter und der Alarmpreis (alarmPrice) aus den Fakten; ist stockLiters größer als 0, nenne die Menge im Silo und ihren aktuellen Wert (stockValue). Keine Empfehlung, nur die Zahlen.
FORWARD_CONTRACT_FULFILLED=Bestätige als Landhändler:in, dass der Vorkontrakt vollständig erfüllt ist (Sorte, Verkaufsstelle, Menge und Festpreis aus den Fakten), und zeige dich zufrieden.
FORWARD_CONTRACT_SHORTFALL=Teile als Landhändler:in sachlich mit, dass beim Vorkontrakt eine Fehlmenge geblieben ist (geliefert von bestellt, Fehlmenge) und die Vertragsstrafe penalty fällig wird. Nenne nur die Zahlen aus den Fakten.
FARM_SHOP_ORDER=Bestelle als Dorfbewohner:in freundlich Ware aus dem Hofladen des Spielers: Sorte, Menge in Litern, Gesamtpreis und Preis je 1.000 Liter, Frist (answerDays Tage) aus den Fakten; zugesagt wird in der App „Handel“.
DROUGHT_WARNING=Warne als Genossenschaft, dass der Monat (month) viel zu trocken war (Regen nur in rainPercent Prozent der Zeit) und nach dryMonthsForDrought trockenen Monaten in Folge eine Dürre ausgerufen wird, die die Preise in der Region steigen lässt. Keine Vorhersage, keine Empfehlung zu Saat oder Ernte.
DROUGHT_DECLARED=Teile als Genossenschaft mit, dass nach dryMonths trockenen Monaten in Folge eine Dürre ausgerufen ist; nenne die betroffenen Kulturen (crops), für die die Abnehmer in der Region jetzt mehr zahlen. Der Ertrag auf den Feldern des Spielers wird nicht beziffert.
DROUGHT_AID_OFFER=Teile als Landwirtschaftsamt mit, dass der Betrieb wegen der Dürre eine Dürrehilfe beantragen kann: hectares Hektar mit wachsender Kultur, aidPerHectare Euro je Hektar, Betrag amount Euro; ist insured=true, erkläre den Abzug von deductionPercent Prozent wegen der Dürreversicherung. Der Antrag wird in der App „Ämter“ innerhalb von applicationDays Tagen gestellt.
DROUGHT_INSURANCE_OFFER=Biete als Versicherungsmakler eine Dürreversicherung nach Wetterindex an: Beitrag premiumPerHectare Euro je Hektar und Monat (für hectares Hektar derzeit monthlyPremium Euro), Auszahlung payoutPerHectare Euro je Hektar bei einer ausgerufenen Dürre ohne Schadensmeldung (heute payout Euro); es zählt nur eine Dürre, deren erster trockener Monat nach dem Abschluss beginnt. Ist afterWarning=true, beziehe dich auf die Trockenheitswarnung der Genossenschaft. Angenommen wird in der App „Versicherung“ innerhalb von validDays Tagen.
DROUGHT_INSURANCE_PAYOUT=Teile als Versicherungsmakler mit, dass die Dürreversicherung wegen der ausgerufenen Dürre ohne Schadensmeldung zahlt: hectares Hektar, payoutPerHectare Euro je Hektar, zusammen payout Euro, sofort überwiesen.
VEHICLE_OFFER=Biete als Werkstatt (sellerKind=WORKSHOP) bzw. als Nachbar (sellerKind=NEIGHBOR) eine gebrauchte Maschine an: Name, Alter in Jahren, Betriebsstunden, Schaden in Prozent und Preis aus den Fakten; Angebote macht der Spieler innerhalb von validDays Tagen über das Formular in der App „Werkstatt“. Keine anderen Zahlen.
VEHICLE_SALE_OFFER=Mache als Nachbar ein erstes Angebot für die Maschine, die der Spieler verkaufen will (vehicleName, offer Euro, Gültigkeit validDays Tage); der Spieler antwortet über das Formular in der App „Werkstatt“.
VEHICLE_DEAL_AGREED=Bestätige die Einigung über die Maschine (vehicleName) zum Endpreis finalPrice; direction=BUY heißt, der Spieler kauft, SELL, er verkauft.
VEHICLE_NO_SPACE=Teile mit, dass die gekaufte Maschine (vehicleName) nicht geliefert werden konnte, weil auf dem Hof kein Shop-Platz frei ist; bitte darum, Platz freizumachen, am nächsten Tag folgt der nächste Versuch (attempt von maxAttempts). Noch ist nichts abgebucht.
VEHICLE_DEAL_FAILED=Teile mit, dass das Geschäft über die Maschine (vehicleName) geplatzt ist, und nenne den Grund (reason); es wurde nichts gebucht.
VEHICLE_SOLD_GOSSIP=Erzähle als Dorfbewohner plaudernd, dass buyerName jetzt die alte Maschine des Spielers (vehicleName) fährt.
OFFICE_CLERK_REMINDER=Erinnere als Bürokraft des Hofes kurz und sachlich an die Frist (title, amount wenn vorhanden) in daysLeft Tagen; subject nennt die Art (TAX_BILL Steuerbescheid, INSPECTION Kontrolle des Amts, DROUGHT_AID Antrag Dürrehilfe, FORWARD_CONTRACT Liefermonat eines Vorkontrakts, LEASE_END Pachtende).
OFFICE_CLERK_PAID=Teile als Bürokraft des Hofes mit, dass du den Steuerbescheid billTitle über amount Euro am Fristtag bezahlt hast, damit kein Säumniszuschlag anfällt.
APPRENTICE_TAKEOVER_REQUEST=Bitte als Azubi des Hofes darum, nach der Ausbildung (in daysLeft Tagen zu Ende) als Maschinenführer/in übernommen zu werden, und nenne dein Wunschgehalt salary Euro im Monat; entschieden wird in der App „Personal“.
APPRENTICE_TAKEN_OVER=Bedanke dich als frisch übernommene/r Maschinenführer/in für die Übernahme zum Gehalt salary Euro.
APPRENTICE_LEAVES=Teile als Azubi enttäuscht, aber freundlich mit, dass du die Ausbildung noch fertig machst und in daysLeft Tagen gehst (reason=COUNTER_REJECTED: das Gegenangebot war zu niedrig; DECLINED: keine Übernahme).
