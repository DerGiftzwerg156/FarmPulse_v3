# Task descriptions per narration event type (building block 4). Keys = NarrationEventType.
ONBOARDING_WELCOME=Schreibe eine kurze Willkommensnachricht an die neue Betriebsleitung des Hofs und erkläre nebenbei, dass man dich per Mail oder Anruf erreicht.
STORY_HOOK=Greife die Prämisse aus den Fakten auf und erzähle sie als persönliche Nachricht, die neugierig macht.
CREDIT_APPROVED=Teile mit, dass der Kreditantrag genehmigt wurde, und nenne Betrag, Zinssatz und monatliche Rate aus den Fakten.
CREDIT_COUNTER_OFFER=Teile mit, dass die Bank statt des beantragten Betrags ein Gegenangebot macht (Werte aus den Fakten), begründe grob anhand der Begründungskategorie und erkläre, dass das Angebot im Bank-Formular angenommen werden kann.
CREDIT_REJECTED=Lehne den Kreditantrag höflich ab und begründe grob anhand der Begründungskategorie, ohne Formeln oder Punktwerte zu nennen.
CREDIT_PAYMENT_REMINDER=Erinnere freundlich, aber bestimmt an die überfällige Kreditrate.
CREDIT_PENALTY=Teile mit, dass wegen des anhaltenden Zahlungsverzugs eine Verzugsgebühr berechnet wurde.
CREDIT_TRUST_WARNING=Mache deutlich, dass der anhaltende Zahlungsverzug das Vertrauen der Bank beschädigt.
CREDIT_CALLBACK=Teile mit, dass die Bank wegen wiederholten Zahlungsausfalls die gesamte Restschuld sofort fällig stellt.
CREDIT_BLOCKED=Teile mit, dass die Bank wegen wiederholten Zahlungsausfalls künftig keine Kredite mehr gewährt.
CREDIT_DEFERRAL_GRANTED=Bestätige die gewährte Stundung und nenne die Dauer aus den Fakten.
CREDIT_DEFERRAL_DENIED=Lehne die Bitte um Stundung ab und begründe grob anhand der Kategorie.
CREDIT_PAID_OFF=Gratuliere zur vollständigen Tilgung des Kredits.
MARKET_PRICE_EVENT=Berichte von der Marktentwicklung (Fruchtart, Verkaufsstelle, Veränderung in Prozent, Dauer) mit einer plausiblen, frei erfundenen Begründung.
MARKET_SPECIAL_OFFER=Biete einen Sonderkontrakt zum Festpreis für die angegebene Menge bis zur Frist an; der Spieler entscheidet im Markt-Formular über die Teilnahme.
MARKET_SUBSIDY=Kündige die Förderung (Betrag aus den Fakten) an.
MARKET_RUMOR=Erzähle ein Gerücht über eine mögliche Preisentwicklung. Ist isAccurate=true, beschreibe die echte Entwicklung bewusst etwas verzerrt; ist isAccurate=false, ist das Gerücht erfunden. Verrate nie, ob es stimmt.
MARKET_CONTRACT_ENDED=Fasse das Ende des Sonderkontrakts mit der gelieferten Menge zusammen.
AUCTION_ANNOUNCED=Kündige die Versteigerung des Feldes an (Größe, Schätzwert, Frist, Anzahl Mitbieter) und erwähne, dass Gebote nur über das Gebotsformular abgegeben werden.
NEGOTIATION_ACCEPTED=Bestätige die Einigung über das Feld zum Endpreis aus den Fakten.
NEGOTIATION_COUNTER=Reagiere auf das Gebot: nenne das Gegenangebot bzw. das aktuelle Höchstgebot aus den Fakten und die verbleibenden Runden.
NEGOTIATION_REJECTED=Lehne das Gebot ab; ist final=true, beende die Verhandlung endgültig.
AUCTION_WON=Gratuliere zum Zuschlag bei der Versteigerung zum Endpreis.
AUCTION_LOST=Teile mit, dass jemand anderes den Zuschlag erhalten hat.
SALE_OFFER_RECEIVED=Mache als Kaufinteressent ein erstes Angebot für das angebotene Feld (Betrag aus den Fakten).
SALE_NO_INTEREST=Teile mit, dass sich zum genannten Wunschpreis derzeit kein Käufer findet.
JOB_APPLICATION=Schreibe eine Bewerbung auf die Stelle; Erfahrung und Gehaltsvorstellung ergeben sich aus den Fakten.
INTERVIEW_ANSWER=Beantworte die Frage im Vorstellungsgespräch in deiner Rolle. Fähigkeiten und Gehaltsvorstellung sind fix und werden nicht verhandelt.
APPLICATION_REJECTED=Reagiere kurz auf die Absage deiner Bewerbung.
EMPLOYEE_WELCOME=Bedanke dich für die Einstellung und freue dich auf die Arbeit.
EMPLOYEE_THANKS=Bedanke dich für die Gehaltserhöhung bzw. die freien Tage.
EMPLOYEE_WARNING=Mache deutlich, dass du unzufrieden bist (Hauptgrund aus den Fakten) und über eine Kündigung nachdenkst.
EMPLOYEE_RESIGNATION=Kündige deine Stelle und verabschiede dich.
EMPLOYEE_SALARY_OVERDUE=Beschwere dich über das ausgebliebene Gehalt.
VILLAGE_CONGRATULATION=Gratuliere zu der guten Entwicklung des Hofs.
VILLAGE_INVITATION=Lade zum Anlass aus den Fakten ins Dorf ein.
VILLAGE_GOSSIP=Erzähle harmlosen Dorfklatsch über die genannte Person, ohne Marktbezug.
CHARACTER_FAREWELL=Verabschiede dich, weil du wegziehst bzw. in den Ruhestand gehst.
CHARACTER_INTRODUCTION=Stelle dich als neue Person im Dorf bzw. als Nachfolge in deiner Rolle vor.
ABSENCE_NOTICE=Schreibe eine automatische Abwesenheitsnotiz für die genannte Person mit der Dauer aus den Fakten.
SUBSTITUTE_INTRODUCTION=Stelle dich als Vertretung für die abwesende Person vor.
REPLY=Antworte auf die Nachricht des Spielers in deiner Rolle.
CALL_CONVERSATION=Antworte im laufenden Telefongespräch kurz und gesprochen in deiner Rolle.
