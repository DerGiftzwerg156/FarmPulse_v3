# dev: H2 file database next to the backend, bridge path points at the bridge simulator.
spring:
  config:
    # Local, never committed overrides (API keys, bridge path ...), see application-local.yml.example.
    # Imported here (not in application.yml) so it overrides the values of this profile file.
    import: optional:file:./application-local.yml
  datasource:
    url: jdbc:h2:file:./data/rpsim-dev
    username: sa
    password:                     # empty: the random password from rpsim.db.password-file is used (review 10/2026 Phase 0.1)
rpsim:
  db:
    password-file: ./data/db.properties
    backup-dir: ./data/backups   # review 10/2026 Phase 1.8: backup at every start, newest 5 kept
  bridge:
    path: ./tools/bridge-simulator/runtime/modSettings/FS25_RPSim
