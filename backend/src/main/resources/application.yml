        overtime-penalty-per-hour: 2
        recovery-per-hour: 0.5
        effect-scales-with-hours: true
        animals-per-keeper: 80
        keeper-overload-penalty-per-day: 3
        keeper-recovery-per-day: 0.5
    hiring:                       # "Kündigung & Bewerbung"
      candidates-min: 3
      candidates-max: 5
      skill-min: 30
      skill-max: 95
      base-salary:
        MACHINE_OPERATOR: 2400.0
        MECHANIC: 2700.0
        ANIMAL_KEEPER: 2200.0
        OFFICE_CLERK: 2300.0
      salary-skill-factor: 0.3
    training:                     # owner decision "Schulungen" (placeholders)
      duration-days: 1
      appreciation-points: 8
      cost:
        LARGE_TRACTOR: 4500
        SELF_PROPELLED: 6000
        SPECIAL_HARVESTER: 7500
        COMBINE: 9000
        FORAGE_HARVESTER: 9000
        TRUCK: 12000
      applicant-chance: 0.3
      applicant-salary-premium: 0.08
      categories:                 # FS25 shop categories (upper case) per training; unlisted categories need none
        LARGE_TRACTOR: [TRACTORSL]
        COMBINE: [HARVESTERS]
        FORAGE_HARVESTER: [FORAGEHARVESTERS]
        SPECIAL_HARVESTER: [BEETVEHICLES, POTATOVEHICLES, VEGETABLEVEHICLES, COTTONVEHICLES, SUGARCANEVEHICLES, GRAPEVEHICLES, OLIVEVEHICLES]
        TRUCK: [TRUCKS]
        SELF_PROPELLED: [SPRAYERVEHICLES, MOWERVEHICLES, FRONTLOADERVEHICLES, TELELOADERVEHICLES, SKIDSTEERVEHICLES, WHEELLOADERVEHICLES]
    reputation:                   # "Dorf-Ansehen"
