      appreciation-decay-per-day: 1.0
      raise-points-per-percent: 2
      raise-max-points: 30
      time-off-points-per-day: 15
      conversation-points: 8
      conversation-cooldown-days: 1
      salary-overdue-delta: -15
      warning-threshold: 30
      warning-after-days: 14
      termination-after-days: 30
      strike-threshold: 30          # Roadmap V2 R2-A5
      strike-after-days: 21
      workload:                     # Roadmap V2 R2-A4 / R2-A7: workload from the real game (placeholders)
