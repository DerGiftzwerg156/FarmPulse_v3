spring:
  application:
    name: rpsim-backend
  profiles:
    default: dev
  # application-local.yml (local, never committed overrides) is imported by the profile files
  # (application-dev.yml / application-prod.yml), not here: an import from this file ranks BELOW
  # application-<profile>.yml, so e.g. rpsim.bridge.path from application-prod.yml would win.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080

# ---------------------------------------------------------------------------------------------------
# rpsim: all tunable values. Every number below is a PLACEHOLDER from the technical concept
# (chapter "Formeln der Fakten-Ebene") - balancing happens during playtesting. Java defaults in
# RpsimProperties mirror this file (asserted by RpsimPropertiesDefaultsTest).
# Full reference: docs/dev/configuration-reference.md
# ---------------------------------------------------------------------------------------------------
rpsim:
  bridge:
    path: ../tools/bridge-simulator/runtime/modSettings/FS25_RPSim
    poll-interval-ms: 2000
    enabled: true
    rewind-auto-resend-max-hours: 24   # T-02: reload without saving up to 1 game day -> re-send lost bookings automatically
    rewind-lookback-hours: 24          # T-02: bookings acked this long before the reloaded point are checked as well
    ingame-notifications: true         # TODO T-21: new mails / incoming calls as in-game notification
    notification-max-age-hours: 2      # TODO T-21: older notifications are dropped by the mod
    ingame-prompts: true               # Roadmap V2 R2-F2: yes/no questions in the game
    prompt-default-kinds: [CALL]       # R2-F2: occasions asked in the game until the player chooses (settings page)
    prompt-max-age-hours: 48           # R2-F2: questions without their own deadline expire after this many game hours
  web:
    static-dir: ""                # release: web/ (built Angular app served on "/"); empty = API only
    lan:                          # Roadmap V3 R3-N2: PIN login of devices in the home network (owner decisions)
      pin-min-length: 4           # PIN = 4..8 digits
      pin-max-length: 8
      max-failed-attempts: 5      # wrong PINs of one sender address before it is locked
      lockout-minutes: 5          # lock after too many wrong PINs (real minutes)
      session-days: 30            # validity of the session cookie (real days; survives a backend restart)
      pbkdf2-iterations: 600000   # PBKDF2WithHmacSHA256 (OWASP Password Storage Cheat Sheet)
      cookie-name: FP_LAN_SESSION
  ai:
    provider: NONE                # FAKE | OPENAI | ANTHROPIC | GEMINI | OLLAMA | NONE
    timeout-seconds: 30
    max-attempts: 2
    local-config-file: ./data/local-config/ai-provider.properties
    locale: de
    worker-interval-ms: 1500
    openai:
      base-url: https://api.openai.com/v1
      model: gpt-4o-mini
    anthropic:
      base-url: https://api.anthropic.com
      model: claude-opus-5
    gemini:
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: gemini-2.5-flash
    ollama:
      base-url: http://localhost:11434
      model: llama3.1
  formulas:
    trust:                        # "TrustScoreService"
      min: -100
      max: 100
      neutral: 0
      decay-start-days: 10
      decay-per-day: 0.5
      on-time-payment: 2
      missed-payment: -5
      promise-kept: 3
      promise-broken: -6
      call-declined: -3
      call-missed: -1
      negotiation-deal: 3
      village-relation-strained: -10
      village-relation-connected: 10
      display-very-good: 50
      display-good: 15
      display-strained: -15
      display-bad: -50
    credit:                       # "Bonitäts-Score", "Zahlungsausfall-Eskalation"
      weight-debt-service-coverage: 0.30
      weight-equity-ratio: 0.25
      weight-liquidity-buffer: 0.15
      weight-loan-to-farm-size: 0.15
      weight-payment-history: 0.15
      payment-history-neutral: 70
      trust-divisor: 10
      trust-cap: 8
      approve-threshold: 75
      counter-threshold: 45
      debt-service-coverage-full: 2.0
      debt-service-coverage-no-history: 50
      cashflow-min-history-days: 1
      liquidity-full-ratio: 0.5
      loan-to-farm-size-full-ratio: 3.0
      cashflow-window-days: 30
      base-interest-rate: 0.05
      counter-max-amount-reduction: 0.5
      counter-max-interest-surcharge: 0.04
      counter-max-term-reduction-months: 12
      min-term-months: 6
      max-term-months: 240
      processing-days-min: 1
      processing-days-max: 2
      office-clerk-reduction-hours: 6
      office-clerk-max-reduction-share: 0.5
      reminder-after-days: 1
      penalty-after-days: 3
      trust-loss-after-days: 5
      final-stage-after-missed-installments: 3
      final-stage: CALLBACK       # CALLBACK | BLOCK
      penalty-rate: 0.05
      trust-loss-delta: -10
      public-default-delta: -30
      deferral-months: 2
      max-deferrals-per-loan: 1
      deferral-min-payment-history: 50
      deferral-max-escalation-level: 1
      legacy-interest-rate: 0.06
      legacy-term-months: 60
      payment-history-missed-penalty: 15
      payment-history-on-time-gain: 2
      standing-crop-discount: 0.5   # Roadmap V2 R2-C5
      special-repayment-free-share: 0.10       # Sondertilgung: fee-free share of the principal per FS25 year
      special-repayment-fee-rate: 0.01         # fee on the part above it (booked on top)
      special-repayment-trust-delta: 3         # trust bonus at the bank advisor ...
      special-repayment-trust-min-share: 0.05  # ... from this share of the remaining debt
      collateral:                 # Roadmap V3 R3-K1: own fields as loan collateral (owner decisions, placeholders)
        loan-to-value: 0.6        # collateral value = field price x 0.6
        max-interest-discount: 0.01   # interest discount at full coverage, proportional below
        farm-size-bonus: 20       # bonus points on "loan too large for the farm" x coverage
        required-above-share: 0.5 # loans above 50 % of the farm assets need collateral for the part above
        menu-sale-trust-delta: -10    # pledged field sold in the game menu ...
        claim-days: 10            # ... claimed Sondertilgung, game days to pay
        claim-overdue-trust-delta: -5 # unpaid claim: trust, a missed installment, no new credit until paid
        realise-on-callback: false  # call-back realises the pledged fields (only in credit-hard)
      annual-review:              # Roadmap V3 R3-K3: annual review at the year change (owner decisions, placeholders)
        enabled: true
        invitation-days: 10
        offer-days: 10
        good-score: 75            # credit score at the cut-off date: rate cut offered from here ...
        bad-score: 45             # ... serious talk below here
        rate-cut: 0.0025          # -0.25 percentage points per review on every running loan
        max-cut-per-loan: 0.01    # at most -1.0 percentage points per loan over its term
        min-rate: 0.01            # never below 1 %
    credit-hard:                  # "Ton-/Genre-Konfigurationsprofile": CreditConfig.HART
      weight-debt-service-coverage: 0.30
      weight-equity-ratio: 0.25
      weight-liquidity-buffer: 0.15
      weight-loan-to-farm-size: 0.15
      weight-payment-history: 0.15
      payment-history-neutral: 70
      trust-divisor: 10
      trust-cap: 5
      approve-threshold: 85
      counter-threshold: 55
      debt-service-coverage-full: 2.0
      debt-service-coverage-no-history: 50
      cashflow-min-history-days: 1
      liquidity-full-ratio: 0.5
      loan-to-farm-size-full-ratio: 3.0
      cashflow-window-days: 30
      base-interest-rate: 0.05
      counter-max-amount-reduction: 0.5
      counter-max-interest-surcharge: 0.04
      counter-max-term-reduction-months: 12
      min-term-months: 6
      max-term-months: 240
      processing-days-min: 1
      processing-days-max: 2
      office-clerk-reduction-hours: 6
      office-clerk-max-reduction-share: 0.5
      reminder-after-days: 1
      penalty-after-days: 3
      trust-loss-after-days: 5
      final-stage-after-missed-installments: 3
      final-stage: CALLBACK
      penalty-rate: 0.05
      trust-loss-delta: -10
      public-default-delta: -30
      deferral-months: 2
      max-deferrals-per-loan: 1
      deferral-min-payment-history: 50
      deferral-max-escalation-level: 1
      legacy-interest-rate: 0.06
      legacy-term-months: 60
      payment-history-missed-penalty: 15
      payment-history-on-time-gain: 2
      standing-crop-discount: 0.5   # Roadmap V2 R2-C5
      special-repayment-free-share: 0.10       # Sondertilgung: fee-free share of the principal per FS25 year
      special-repayment-fee-rate: 0.01         # fee on the part above it (booked on top)
      special-repayment-trust-delta: 3         # trust bonus at the bank advisor ...
      special-repayment-trust-min-share: 0.05  # ... from this share of the remaining debt
      collateral:                 # Roadmap V3 R3-K1: own fields as loan collateral (owner decisions, placeholders)
        loan-to-value: 0.6        # collateral value = field price x 0.6
        max-interest-discount: 0.01   # interest discount at full coverage, proportional below
        farm-size-bonus: 20       # bonus points on "loan too large for the farm" x coverage
        required-above-share: 0.5 # loans above 50 % of the farm assets need collateral for the part above
        menu-sale-trust-delta: -10    # pledged field sold in the game menu ...
        claim-days: 10            # ... claimed Sondertilgung, game days to pay
        claim-overdue-trust-delta: -5 # unpaid claim: trust, a missed installment, no new credit until paid
        realise-on-callback: true  # call-back realises the pledged fields (harsh world mode only)
      annual-review:              # Roadmap V3 R3-K3: annual review at the year change (owner decisions, placeholders)
        enabled: true
        invitation-days: 10
        offer-days: 10
        good-score: 75            # credit score at the cut-off date: rate cut offered from here ...
        bad-score: 45             # ... serious talk below here
        rate-cut: 0.0025          # -0.25 percentage points per review on every running loan
        max-cut-per-loan: 0.01    # at most -1.0 percentage points per loan over its term
