        DEMAND_SLUMP: 2.0
        HARVEST_FAILURE: 1.0
        HARVEST_SURPLUS: 1.0
        SPECIAL_OFFER: 1.0
        SUBSIDY: 0.5
        RUMOR: 1.5
      bands:
        DEMAND_SPIKE:    { multiplier-min: 1.08, multiplier-max: 1.25, ramp-hours-min: 12, ramp-hours-max: 36, hold-hours-min: 72, hold-hours-max: 168, decay-hours-min: 48, decay-hours-max: 120 }
        DEMAND_SLUMP:    { multiplier-min: 0.75, multiplier-max: 0.92, ramp-hours-min: 12, ramp-hours-max: 36, hold-hours-min: 72, hold-hours-max: 168, decay-hours-min: 48, decay-hours-max: 120 }
        HARVEST_FAILURE: { multiplier-min: 1.10, multiplier-max: 1.30, ramp-hours-min: 24, ramp-hours-max: 48, hold-hours-min: 96, hold-hours-max: 240, decay-hours-min: 72, decay-hours-max: 168 }
        HARVEST_SURPLUS: { multiplier-min: 0.70, multiplier-max: 0.90, ramp-hours-min: 24, ramp-hours-max: 48, hold-hours-min: 96, hold-hours-max: 240, decay-hours-min: 72, decay-hours-max: 168 }
      special-offer-premium-min: 1.10
      special-offer-premium-max: 1.30
      special-offer-quantity-min: 5000
      special-offer-quantity-max: 30000
      special-offer-days-min: 3
      special-offer-days-max: 7
      subsidy-amount-min: 2000
      subsidy-amount-max: 15000
      event-call-probability: 0.2
    negotiation:                  # "Verhandlungs-Preisfindung"
      max-rounds: 3
      counter-band: 0.9
      trust-divisor: 20
      trust-cap: 0.05
      stubbornness-discount:
