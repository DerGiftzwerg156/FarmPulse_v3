    market:                       # "Preis-Events & Sonderkontrakte"
      daily-spawn-probability: 0.15
      max-active-events: 3
      advance-notice-probability: 0.15
      advance-notice-days-min: 2
      advance-notice-days-max: 4
      rumor-accurate-probability: 0.7
      target-base-weight: 1.0
      target-stock-weight: 4.0
      type-weights:
