      min-term-months: 6
      max-term-months: 240
      processing-days-min: 1
      processing-days-max: 2
      office-clerk-reduction-hours: 6
      office-clerk-max-reduction-share: 0.5
      reminder-after-days: 1
      penalty-after-days: 3
      trust-loss-after-days: 5
      final-stage-after-missed-installments: 3
      final-stage: CALLBACK
      penalty-rate: 0.05
      trust-loss-delta: -10
      public-default-delta: -30
      deferral-months: 2
      max-deferrals-per-loan: 1
      deferral-min-payment-history: 50
      deferral-max-escalation-level: 1
      legacy-interest-rate: 0.06
      legacy-term-months: 60
      payment-history-missed-penalty: 15
      payment-history-on-time-gain: 2
      standing-crop-discount: 0.5   # Roadmap V2 R2-C5
      special-repayment-free-share: 0.10       # Sondertilgung: fee-free share of the principal per FS25 year
      special-repayment-fee-rate: 0.01         # fee on the part above it (booked on top)
      special-repayment-trust-delta: 3         # trust bonus at the bank advisor ...
      special-repayment-trust-min-share: 0.05  # ... from this share of the remaining debt
